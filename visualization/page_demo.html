<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>宁波市二手房市场价格洞察大屏 — Page 布局版</title>
  <script src="./echarts.min.js"></script>
  <script src="./real_data.js"></script>
  <script src="./ningbo_geo.js"></script>
  <style>
    :root {
      --bg: #0f1c3f;
      --card: #16264d;
      --gold: #f6c344;
      --cyan: #37c6ff;
      --orange: #ff9c6e;
      --grey: #8ea0c4;
      --text: #e8eefc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 标题栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 24px 10px;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, var(--cyan), var(--gold), transparent) 1;
    }
    header h1 { font-size: 26px; letter-spacing: 2px; }
    header h1 span { color: var(--gold); }
    header .meta { color: var(--grey); font-size: 13px; }
    /* KPI 栏 */
    .kpi-row {
      display: flex;
      gap: 16px;
      padding: 12px 24px;
    }
    .kpi {
      flex: 1;
      background: var(--card);
      border-radius: 8px;
      padding: 12px 18px;
      border: 1px solid rgba(55, 198, 255, .25);
    }
    .kpi .label { color: var(--grey); font-size: 13px; }
    .kpi .value { font-size: 30px; font-weight: bold; margin-top: 4px; }
    .kpi .value.gold { color: var(--gold); }
    .kpi .value.cyan { color: var(--cyan); }
    .kpi .value.orange { color: var(--orange); }
    /* 三列图表区 */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 27% 40% 27%;
      gap: 14px;
      padding: 0 24px 12px;
    }
    .col { display: flex; flex-direction: column; gap: 14px; }
    .panel {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid rgba(55, 198, 255, .18);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      font-size: 15px;
      padding: 8px 14px 0;
      color: var(--cyan);
      font-weight: normal;
    }
    .panel .chart { flex: 1; min-height: 0; }
    /* 中间地图为主视觉，占最大区块 */
    .panel.map { flex: 1.6; }
    .panel.placeholder-note {
      color: var(--grey);
    }
    /* 页脚 */
    footer {
      text-align: center;
      color: var(--grey);
      font-size: 12px;
      padding: 8px 0 10px;
      border-top: 1px solid rgba(142, 160, 196, .2);
    }
  </style>
</head>
<body>
  <header>
    <h1>宁波市二手房市场价格<span>洞察</span>大屏</h1>
    <div class="meta">数据截至 2026-11-25 · 宁波二手房项目小组（成员 A/B/C）</div>
  </header>

  <!-- KPI 指标卡：数据为占位假数据，字段口径与《数据字段说明》一致 -->
  <div class="kpi-row">
    <div class="kpi"><div class="label">在售房源总数</div><div class="value cyan">1195</div></div>
    <div class="kpi"><div class="label">全市平均单价 (元/㎡)</div><div class="value gold">14,260</div></div>
    <div class="kpi"><div class="label">单价中位数 (元/㎡)</div><div class="value gold">12,738</div></div>
    <div class="kpi"><div class="label">覆盖行政区数</div><div class="value orange">11</div></div>
  </div>

  <div class="grid">
    <!-- 左列 -->
    <div class="col">
      <div class="panel" style="flex:1.2">
        <h2>各行政区平均单价（元/㎡）</h2>
        <div id="chart1" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>面积与单价散点分析</h2>
        <div id="chart3" class="chart"></div>
      </div>
    </div>

    <!-- 中列：主视觉 -->
    <div class="col">
      <div class="panel map">
        <h2>宁波市行政区房价地图</h2>
        <div id="chart6" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>总价区间占比</h2>
        <div id="chart2" class="chart"></div>
      </div>
    </div>

    <!-- 右列 -->
    <div class="col">
      <div class="panel" style="flex:1">
        <h2>各行政区单价分布箱线图</h2>
        <div id="chart4" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>数值变量相关性热力图</h2>
        <div id="chart5" class="chart"></div>
      </div>
    </div>
  </div>

  <footer>数据来源：贝壳找房·宁波站（2026-11-25 采集，仅供课程学习） · 可视化：成员 C</footer>

<script>
// ============ 真实数据：由 analysis/dashboard_stats.py 生成（data/raw/raw_data.csv，1195 条） ============
const districtAvg = DISTRICT_AVG;          // [行政区, 平均单价, 房源数]，按均价降序
const priceRanges = PRICE_RANGES;          // 总价分箱（B 建议口径：≤80 / 80-150 / 150-300 / >300 万）
const scatterData = SCATTER;               // 面积 × 单价，全量 1195 点
const boxData = BOX;                       // 各区五数概括 [min,q1,中位数,q3,max]
const corrLabels = CORR_LABELS;
const corrData = CORR.flatMap((row, i) => row.map((v, j) => [i, j, v]));

const dark = {
  textStyle: { color: '#8ea0c4' },
  tooltip: { backgroundColor: '#16264d', borderColor: '#37c6ff', textStyle: { color: '#e8eefc' } }
};
const charts = {};

// 图 1：各区均价柱状图（Tooltip + DataZoom）
charts.chart1 = echarts.init(document.getElementById('chart1'));
charts.chart1.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'axis', formatter: p => `${p[0].name}：均价 ${p[0].value} 元/㎡，${districtAvg[p[0].dataIndex][2]} 套在售` },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: districtAvg.map(d => d[0]), axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: '#8ea0c4' } },
  dataZoom: [{ type: 'inside' }],
  series: [{
    type: 'bar', data: districtAvg.map(d => d[1]),
    itemStyle: { color: '#37c6ff', borderRadius: [3, 3, 0, 0] }
  }]
});

// 图 3：面积-单价散点（VisualMap 颜色映射）
charts.chart3 = echarts.init(document.getElementById('chart3'));
charts.chart3.setOption({
  ...dark,
  tooltip: { ...dark.tooltip },
  grid: { left: 60, right: 20, top: 20, bottom: 30 },
  xAxis: { type: 'value', name: '面积(平米)', axisLabel: { color: '#8ea0c4' } },
  yAxis: { type: 'value', name: '单价(元/平)', axisLabel: { color: '#8ea0c4' } },
  visualMap: {
    min: 3000, max: 45000, dimension: 1,
    inRange: { color: ['#37c6ff', '#f6c344', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }, show: false
  },
  series: [{ type: 'scatter', data: scatterData, symbolSize: 6, itemStyle: { opacity: .8 } }]
});

// 图 6：宁波市行政区真实地图（边界：阿里云 DataV geoJSON；前湾新区无官方边界，不涂色）
charts.chart6 = echarts.init(document.getElementById('chart6'));
echarts.registerMap('ningbo', NINGBO_GEO);
charts.chart6.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, formatter: p => `${p.name}：${p.value != null && !isNaN(p.value) ? '均价 ' + p.value + ' 元/㎡，' + p.data.count + ' 套在售' : '无边界数据'}` },
  visualMap: {
    min: 6000, max: 23000,
    inRange: { color: ['#37c6ff', '#f6c344', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }
  },
  series: [{
    type: 'map', map: 'ningbo', roam: true,
    data: districtAvg.map(d => ({ name: d[0], value: d[1], count: d[2] })),
    label: { show: true, color: '#e8eefc', fontSize: 10 },
    itemStyle: { areaColor: '#1a2a55', borderColor: '#0f1c3f' },
    emphasis: { label: { color: '#f6c344' } }
  }],
  graphic: [{
    type: 'text', right: 20, top: 10,
    style: { text: '前湾新区无官方边界数据，未着色', fill: '#ff9c6e', fontSize: 12 }
  }]
});

// 图 2：总价区间饼图
charts.chart2 = echarts.init(document.getElementById('chart2'));
charts.chart2.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'item', formatter: '{b}: {c}套 ({d}%)' },
  series: [{
    type: 'pie', radius: ['35%', '65%'],
    data: priceRanges,
    label: { color: '#8ea0c4' },
    itemStyle: { borderColor: '#16264d', borderWidth: 2 }
  }],
  color: ['#37c6ff', '#f6c344', '#ff9c6e', '#8ea0c4', '#2f9fd8', '#d9a94a']
});

// 图 4：箱线图
charts.chart4 = echarts.init(document.getElementById('chart4'));
charts.chart4.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'item' },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: districtAvg.map(d => d[0]), axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: '#8ea0c4' } },
  series: [{ type: 'boxplot', data: districtAvg.map(d => boxData[d[0]]), itemStyle: { color: '#16264d', borderColor: '#37c6ff' } }]
});

// 图 5：相关性热力图
charts.chart5 = echarts.init(document.getElementById('chart5'));
charts.chart5.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, formatter: p => `${corrLabels[p.value[0]]} × ${corrLabels[p.value[1]]}：${p.value[2].toFixed(4)}` },
  grid: { left: 90, right: 20, top: 20, bottom: 60 },
  xAxis: { type: 'category', data: corrLabels, axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'category', data: corrLabels, axisLabel: { color: '#8ea0c4' } },
  visualMap: {
    min: -1, max: 1, calculable: true,
    inRange: { color: ['#37c6ff', '#16264d', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }, orient: 'horizontal', left: 'center', bottom: 0
  },
  series: [{
    type: 'heatmap', data: corrData,
    label: { show: true, color: '#e8eefc', formatter: p => p.value[2].toFixed(4) }
  }]
});

window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
</script>
</body>
</html>
