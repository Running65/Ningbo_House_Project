<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>宁波市二手房市场价格洞察 — Page 布局 · 深色版</title>
  <script src="./echarts.min.js"></script>
  <script src="./real_data.js"></script>
  <script src="./ningbo_geo.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #21262d;
      --accent: #58a6ff;
      --gold: #d29922;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 标题栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 18px 28px 14px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
    header h1 span { color: var(--accent); }
    header .meta { color: var(--muted); font-size: 13px; }
    /* KPI 栏 */
    .kpi-row {
      display: flex;
      gap: 16px;
      padding: 16px 28px 0;
    }
    .kpi {
      flex: 1;
      background: var(--card);
      border-radius: 10px;
      padding: 14px 18px;
      border: 1px solid var(--line);
    }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .kpi .value.accent { color: var(--accent); }
    /* 三列图表区 */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 27% 40% 27%;
      gap: 16px;
      padding: 16px 28px;
    }
    .col { display: flex; flex-direction: column; gap: 16px; }
    .panel {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      font-size: 14px;
      padding: 12px 16px 0;
      color: var(--muted);
      font-weight: 600;
    }
    .panel .chart { flex: 1; min-height: 0; }
    /* 中间地图为主视觉，占最大区块 */
    .panel.map { flex: 1.6; }
    /* 页脚 */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 10px 0 12px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <header>
    <h1>宁波市二手房市场价格<span>洞察</span></h1>
    <div class="meta">数据截至 2026-11-25 · 宁波二手房项目小组（成员 A/B/C）</div>
  </header>

  <!-- KPI 指标卡：数值由 analysis/dashboard_stats.py 从真实数据计算 -->
  <div class="kpi-row">
    <div class="kpi"><div class="label">在售房源总数</div><div class="value">1,195</div></div>
    <div class="kpi"><div class="label">全市平均单价 (元/㎡)</div><div class="value accent">14,260</div></div>
    <div class="kpi"><div class="label">单价中位数 (元/㎡)</div><div class="value">12,738</div></div>
    <div class="kpi"><div class="label">覆盖行政区数</div><div class="value" style="color: var(--gold)">11</div></div>
  </div>

  <div class="grid">
    <!-- 左列 -->
    <div class="col">
      <div class="panel" style="flex:1.2">
        <h2>各行政区平均单价（元/㎡）</h2>
        <div id="chart1" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>面积与单价散点分析</h2>
        <div id="chart3" class="chart"></div>
      </div>
    </div>

    <!-- 中列：主视觉 -->
    <div class="col">
      <div class="panel map">
        <h2>宁波市行政区房价地图</h2>
        <div id="chart6" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>总价区间占比</h2>
        <div id="chart2" class="chart"></div>
      </div>
    </div>

    <!-- 右列 -->
    <div class="col">
      <div class="panel" style="flex:1">
        <h2>各行政区单价分布箱线图</h2>
        <div id="chart4" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h2>数值变量相关性热力图</h2>
        <div id="chart5" class="chart"></div>
      </div>
    </div>
  </div>

  <footer>数据来源：贝壳找房·宁波站（2026-11-25 采集，仅供课程学习） · 可视化：成员 C</footer>

<script>
// ============ 真实数据：由 analysis/dashboard_stats.py 生成（data/raw/raw_data.csv，1195 条） ============
const districtAvg = DISTRICT_AVG;          // [行政区, 平均单价, 房源数]，按均价降序
const priceRanges = PRICE_RANGES;          // 总价分箱（B 建议口径：≤80 / 80-150 / 150-300 / >300 万）
const scatterData = SCATTER;               // 面积 × 单价，全量 1195 点
const boxData = BOX;                       // 各区五数概括 [min,q1,中位数,q3,max]
const corrLabels = CORR_LABELS;
const corrData = CORR.flatMap((row, i) => row.map((v, j) => [i, j, v]));

// ---- 深色低饱和主题 ----
const AXIS = '#8b949e', TEXT = '#e6edf3', ACCENT = '#58a6ff', GOLD = '#d29922';
const CARD = '#161b22', LINEC = '#21262d';
const theme = {
  textStyle: { color: AXIS },
  tooltip: { backgroundColor: '#1c2128', borderColor: '#30363d', textStyle: { color: TEXT },
             extraCssText: 'box-shadow: 0 4px 12px rgba(0,0,0,.4); border-radius: 8px;' }
};
const charts = {};

// 图 1：各区均价柱状图（Tooltip + DataZoom）
charts.chart1 = echarts.init(document.getElementById('chart1'));
charts.chart1.setOption({
  ...theme,
  tooltip: { ...theme.tooltip, trigger: 'axis', formatter: p => `${p[0].name}：均价 ${p[0].value} 元/㎡，${districtAvg[p[0].dataIndex][2]} 套在售` },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: districtAvg.map(d => d[0]), axisLabel: { color: AXIS, rotate: 30 }, axisLine: { lineStyle: { color: LINEC } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: AXIS }, splitLine: { lineStyle: { color: LINEC } } },
  dataZoom: [{ type: 'inside' }],
  series: [{
    type: 'bar', data: districtAvg.map(d => d[1]),
    itemStyle: { color: ACCENT, borderRadius: [4, 4, 0, 0], opacity: .85 }
  }]
});

// 图 3：面积-单价散点（VisualMap 颜色映射）
charts.chart3 = echarts.init(document.getElementById('chart3'));
charts.chart3.setOption({
  ...theme,
  tooltip: { ...theme.tooltip },
  grid: { left: 60, right: 20, top: 20, bottom: 30 },
  xAxis: { type: 'value', name: '面积(平米)', axisLabel: { color: AXIS }, splitLine: { lineStyle: { color: LINEC } } },
  yAxis: { type: 'value', name: '单价(元/平)', axisLabel: { color: AXIS }, splitLine: { lineStyle: { color: LINEC } } },
  visualMap: {
    min: 3000, max: 45000, dimension: 1,
    inRange: { color: [ACCENT, GOLD, '#da6c4e'] },
    textStyle: { color: AXIS }, show: false
  },
  series: [{ type: 'scatter', data: scatterData, symbolSize: 6, itemStyle: { opacity: .5, color: ACCENT } }]
});

// 图 6：宁波市行政区真实地图（边界：阿里云 DataV geoJSON；前湾新区无官方边界，不涂色）
charts.chart6 = echarts.init(document.getElementById('chart6'));
echarts.registerMap('ningbo', NINGBO_GEO);
charts.chart6.setOption({
  ...theme,
  tooltip: { ...theme.tooltip, formatter: p => `${p.name}：${p.value != null && !isNaN(p.value) ? '均价 ' + p.value + ' 元/㎡，' + p.data.count + ' 套在售' : '无边界数据'}` },
  visualMap: {
    min: 6000, max: 23000,
    inRange: { color: ['#12233d', '#1f4a75', '#3d7fb8', '#79b8e8'] },
    textStyle: { color: AXIS }
  },
  series: [{
    type: 'map', map: 'ningbo', roam: true,
    data: districtAvg.map(d => ({ name: d[0], value: d[1], count: d[2] })),
    label: { show: true, color: TEXT, fontSize: 10 },
    itemStyle: { areaColor: '#1c2530', borderColor: '#0d1117' },
    emphasis: { label: { color: ACCENT, fontWeight: 'bold' } }
  }],
  graphic: [{
    type: 'text', right: 20, top: 10,
    style: { text: '前湾新区无官方边界数据，未着色', fill: GOLD, fontSize: 12 }
  }]
});

// 图 2：总价区间饼图
charts.chart2 = echarts.init(document.getElementById('chart2'));
charts.chart2.setOption({
  ...theme,
  tooltip: { ...theme.tooltip, trigger: 'item', formatter: '{b}: {c}套 ({d}%)' },
  series: [{
    type: 'pie', radius: ['40%', '68%'],
    data: priceRanges,
    label: { color: AXIS },
    itemStyle: { borderColor: CARD, borderWidth: 2 }
  }],
  color: [ACCENT, '#3d7fb8', GOLD, '#484f58']
});

// 图 4：箱线图
charts.chart4 = echarts.init(document.getElementById('chart4'));
charts.chart4.setOption({
  ...theme,
  tooltip: { ...theme.tooltip, trigger: 'item' },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: districtAvg.map(d => d[0]), axisLabel: { color: AXIS, rotate: 30 }, axisLine: { lineStyle: { color: LINEC } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: AXIS }, splitLine: { lineStyle: { color: LINEC } } },
  series: [{ type: 'boxplot', data: districtAvg.map(d => boxData[d[0]]), itemStyle: { color: '#1c2530', borderColor: ACCENT } }]
});

// 图 5：相关性热力图
charts.chart5 = echarts.init(document.getElementById('chart5'));
charts.chart5.setOption({
  ...theme,
  tooltip: { ...theme.tooltip, formatter: p => `${corrLabels[p.value[0]]} × ${corrLabels[p.value[1]]}：${p.value[2].toFixed(4)}` },
  grid: { left: 90, right: 20, top: 20, bottom: 60 },
  xAxis: { type: 'category', data: corrLabels, axisLabel: { color: AXIS, rotate: 30 } },
  yAxis: { type: 'category', data: corrLabels, axisLabel: { color: AXIS } },
  visualMap: {
    min: -1, max: 1, calculable: true,
    inRange: { color: ['#12233d', '#1c2530', '#da6c4e'] },
    textStyle: { color: AXIS }, orient: 'horizontal', left: 'center', bottom: 0
  },
  series: [{
    type: 'heatmap', data: corrData,
    label: { show: true, color: TEXT, formatter: p => p.value[2].toFixed(4) }
  }]
});

window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
</script>
</body>
</html>
