<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>宁波市二手房市场价格洞察大屏 — Tab 布局版</title>
  <script src="./echarts.min.js"></script>
  <style>
    :root {
      --bg: #0f1c3f;
      --card: #16264d;
      --gold: #f6c344;
      --cyan: #37c6ff;
      --orange: #ff9c6e;
      --grey: #8ea0c4;
      --text: #e8eefc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 10px;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, var(--cyan), var(--gold), transparent) 1;
    }
    header h1 { font-size: 26px; letter-spacing: 2px; }
    header h1 span { color: var(--gold); }
    header .meta { color: var(--grey); font-size: 13px; }
    .kpi-row { display: flex; gap: 16px; padding: 12px 24px; }
    .kpi {
      flex: 1;
      background: var(--card);
      border-radius: 8px;
      padding: 12px 18px;
      border: 1px solid rgba(55, 198, 255, .25);
    }
    .kpi .label { color: var(--grey); font-size: 13px; }
    .kpi .value { font-size: 30px; font-weight: bold; margin-top: 4px; }
    .kpi .value.gold { color: var(--gold); }
    .kpi .value.cyan { color: var(--cyan); }
    .kpi .value.orange { color: var(--orange); }
    /* Tab 导航 */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 24px 10px;
    }
    .tab-btn {
      background: var(--card);
      color: var(--grey);
      border: 1px solid rgba(55, 198, 255, .25);
      border-radius: 6px 6px 0 0;
      padding: 8px 22px;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
      background: rgba(22, 38, 77, .7);
    }
    /* 图表区：每页 2 图并排 */
    .grid {
      flex: 1;
      display: none;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      padding: 0 24px 12px;
    }
    .grid.active { display: grid; }
    .panel {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid rgba(55, 198, 255, .18);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      font-size: 15px;
      padding: 8px 14px 0;
      color: var(--cyan);
      font-weight: normal;
    }
    .panel .chart { flex: 1; min-height: 0; }
    footer {
      text-align: center;
      color: var(--grey);
      font-size: 12px;
      padding: 8px 0 10px;
      border-top: 1px solid rgba(142, 160, 196, .2);
    }
  </style>
</head>
<body>
  <header>
    <h1>宁波市二手房市场价格<span>洞察</span>大屏</h1>
    <div class="meta">数据截至 2026-11-25 · Tab 布局版</div>
  </header>

  <div class="kpi-row">
    <div class="kpi"><div class="label">在售房源总数</div><div class="value cyan">1320</div></div>
    <div class="kpi"><div class="label">全市平均单价 (元/㎡)</div><div class="value gold">17,842</div></div>
    <div class="kpi"><div class="label">单价中位数 (元/㎡)</div><div class="value gold">16,530</div></div>
    <div class="kpi"><div class="label">覆盖行政区数</div><div class="value orange">10</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-page="p1">价格总览</button>
    <button class="tab-btn" data-page="p2">区域分析</button>
    <button class="tab-btn" data-page="p3">深入分析</button>
  </div>

  <!-- Tab 1：价格总览 -->
  <div class="grid active" id="page-p1">
    <div class="panel">
      <h2>总价区间占比</h2>
      <div id="chart2" class="chart"></div>
    </div>
    <div class="panel">
      <h2>面积与单价散点分析</h2>
      <div id="chart3" class="chart"></div>
    </div>
  </div>

  <!-- Tab 2：区域分析（行政区字段 A 后续补采，地图占位） -->
  <div class="grid" id="page-p2">
    <div class="panel">
      <h2>各行政区平均单价（元/㎡）</h2>
      <div id="chart1" class="chart"></div>
    </div>
    <div class="panel">
      <h2>宁波市行政区房价地图（占位）</h2>
      <div id="chart6" class="chart"></div>
    </div>
  </div>

  <!-- Tab 3：深入分析 -->
  <div class="grid" id="page-p3">
    <div class="panel">
      <h2>各行政区单价分布箱线图</h2>
      <div id="chart4" class="chart"></div>
    </div>
    <div class="panel">
      <h2>数值变量相关性热力图</h2>
      <div id="chart5" class="chart"></div>
    </div>
  </div>

  <footer>数据来源：贝壳找房·宁波站（2026-11-25 采集，仅供课程学习） · 可视化：成员 C</footer>

<script>
// ============ 假数据：字段口径与 docs/数据字段说明.md 一致，待 B 的 clean_data.csv 替换 ============
const districtAvg = [
  ['鄞州', 21500], ['海曙', 20800], ['江北', 18600], ['镇海', 15200],
  ['北仑', 14500], ['奉化', 11800], ['象山', 11200], ['宁海', 10800]
];
const priceRanges = [
  { value: 420, name: '<100万' },
  { value: 380, name: '100-150万' },
  { value: 260, name: '150-200万' },
  { value: 180, name: '200-300万' },
  { value: 60,  name: '300-500万' },
  { value: 20,  name: '>500万' }
];
const scatterData = [];
for (let i = 0; i < 50; i++) {
  const area = Math.round(30 + Math.random() * 150);
  scatterData.push([area, Math.round(26000 - area * 60 + (Math.random() - .5) * 6000)]);
}
const boxData = [
  [12000, 15000, 18000, 21000, 26000],
  [11000, 14000, 17000, 20000, 25000],
  [10000, 13000, 16000, 19000, 24000],
  [9000, 11000, 14000, 17000, 22000],
  [8000, 10000, 12000, 15000, 20000]
];
const corrLabels = ['总价(万)', '单价(元/平)', '面积'];
const corrData = [
  [0, 0, 1.0], [0, 1, 0.62], [0, 2, 0.85],
  [1, 0, 0.62], [1, 1, 1.0], [1, 2, 0.31],
  [2, 0, 0.85], [2, 1, 0.31], [2, 2, 1.0]
];

const dark = {
  textStyle: { color: '#8ea0c4' },
  tooltip: { backgroundColor: '#16264d', borderColor: '#37c6ff', textStyle: { color: '#e8eefc' } }
};
const charts = {};

charts.chart1 = echarts.init(document.getElementById('chart1'));
charts.chart1.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'axis' },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: districtAvg.map(d => d[0]), axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: '#8ea0c4' } },
  dataZoom: [{ type: 'inside' }],
  series: [{ type: 'bar', data: districtAvg.map(d => d[1]),
    itemStyle: { color: '#37c6ff', borderRadius: [3, 3, 0, 0] } }]
});

charts.chart2 = echarts.init(document.getElementById('chart2'));
charts.chart2.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'item', formatter: '{b}: {c}套 ({d}%)' },
  series: [{ type: 'pie', radius: ['35%', '65%'], data: priceRanges,
    label: { color: '#8ea0c4' },
    itemStyle: { borderColor: '#16264d', borderWidth: 2 } }],
  color: ['#37c6ff', '#f6c344', '#ff9c6e', '#8ea0c4', '#2f9fd8', '#d9a94a']
});

charts.chart3 = echarts.init(document.getElementById('chart3'));
charts.chart3.setOption({
  ...dark,
  tooltip: { ...dark.tooltip },
  grid: { left: 60, right: 20, top: 20, bottom: 30 },
  xAxis: { type: 'value', name: '面积(平米)', axisLabel: { color: '#8ea0c4' } },
  yAxis: { type: 'value', name: '单价(元/平)', axisLabel: { color: '#8ea0c4' } },
  visualMap: {
    min: 8000, max: 26000, dimension: 1,
    inRange: { color: ['#37c6ff', '#f6c344', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }, show: false
  },
  series: [{ type: 'scatter', data: scatterData, symbolSize: 6, itemStyle: { opacity: .8 } }]
});

charts.chart4 = echarts.init(document.getElementById('chart4'));
charts.chart4.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, trigger: 'item' },
  grid: { left: 60, right: 10, top: 20, bottom: 40 },
  xAxis: { type: 'category', data: ['鄞州', '海曙', '江北', '镇海', '北仑'], axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'value', name: '元/㎡', axisLabel: { color: '#8ea0c4' } },
  series: [{ type: 'boxplot', data: boxData,
    itemStyle: { color: '#16264d', borderColor: '#37c6ff' } }]
});

charts.chart5 = echarts.init(document.getElementById('chart5'));
charts.chart5.setOption({
  ...dark,
  tooltip: { ...dark.tooltip, formatter: p => `${corrLabels[p.value[0]]} × ${corrLabels[p.value[1]]}：${p.value[2]}` },
  grid: { left: 90, right: 20, top: 20, bottom: 60 },
  xAxis: { type: 'category', data: corrLabels, axisLabel: { color: '#8ea0c4', rotate: 30 } },
  yAxis: { type: 'category', data: corrLabels, axisLabel: { color: '#8ea0c4' } },
  visualMap: {
    min: -1, max: 1, calculable: true,
    inRange: { color: ['#37c6ff', '#16264d', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }, orient: 'horizontal', left: 'center', bottom: 0
  },
  series: [{ type: 'heatmap', data: corrData, label: { show: true, color: '#e8eefc' } }]
});

// Tab 6 的占位放在区域分析页
charts.chart6 = echarts.init(document.getElementById('chart6'));
charts.chart6.setOption({
  ...dark,
  tooltip: { ...dark.tooltip },
  grid: { left: 60, right: 30, top: 30, bottom: 40 },
  xAxis: { type: 'value', axisLabel: { color: '#8ea0c4' } },
  yAxis: { type: 'category', data: districtAvg.map(d => d[0]).reverse(), axisLabel: { color: '#e8eefc' } },
  visualMap: {
    min: 10000, max: 22000,
    inRange: { color: ['#37c6ff', '#f6c344', '#ff9c6e'] },
    textStyle: { color: '#8ea0c4' }
  },
  series: [{
    type: 'bar', data: districtAvg.map(d => d[1]).reverse(),
    itemStyle: { borderRadius: [0, 3, 3, 0] },
    label: { show: true, position: 'right', color: '#8ea0c4' }
  }],
  graphic: [{
    type: 'text', right: 20, top: 10,
    style: { text: 'geoJSON 验证后升级为真实地图', fill: '#ff9c6e', fontSize: 12 }
  }]
});

// Tab 切换逻辑
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    // 隐藏容器中的图表初始化时尺寸为 0，切换后必须 resize
    Object.values(charts).forEach(c => c.resize());
  });
});

window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
</script>
</body>
</html>
